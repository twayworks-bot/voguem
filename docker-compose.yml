version: '3.8'

services:
  mobile-journal:
    build: .
    container_name: church-bazaar-journal
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
    volumes:
      # Map the local './data' folder to '/app/data' inside the container
      # to ensure user-uploaded journals and images persist externally.
      - ./data:/app/data
    restart: unless-stopped
